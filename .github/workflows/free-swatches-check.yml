name: Check free-swatches page

# Manual only. Reads la-z-boy.com/content/free-swatches and compares it with the app's covers.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && playwright install --with-deps chromium
      - name: Crawl and compare
        continue-on-error: true
        run: python scripts/swatches/crawl_free_swatches.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/free-swatches-page.json reports/free-swatches-compare.json
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -m "Free-swatches page check results"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
