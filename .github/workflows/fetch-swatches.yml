name: Fetch swatch images

# Manual only. Actions tab -> "Fetch swatch images" -> Run workflow.
# Runs scripts/swatches/fetch_swatches.py on a GitHub runner and commits any new images to the branch it ran on.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only check the first N cover ids (0 = all)'
        default: '0'
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download swatches
        continue-on-error: true
        run: python scripts/swatches/fetch_swatches.py --limit "${{ inputs.limit }}"
      - name: Commit new images
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/swatches public/swatch-manifest.json reports/swatch-report.json
          if git diff --cached --quiet; then echo "Nothing new to commit."; exit 0; fi
          git commit -m "Add swatch images (fetch-swatches workflow)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
